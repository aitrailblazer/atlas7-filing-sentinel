<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1050" width="1680" height="1050" role="img" aria-label="Grading the Grader: Muse Spark 1.3 on 179 frozen SEC filings">
  <rect x="0" y="0" width="1680" height="1050" fill="#FBFBF8"/>

  <!-- ===== Header ===== -->
  <text x="90" y="98" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="45" fill="#1A1A1A">Grading the Grader: Muse Spark 1.3 on 179 Frozen SEC Filings</text>
  <line x1="90" y1="126" x2="1590" y2="126" stroke="#999999" stroke-width="1"/>
  <text x="90" y="160" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#444444">ATLAS-7 Filing Sentinel, Open Model Grading, reference arm. Corpus scope: 38 complete submissions, 141 primary-plus-EX-99. Temperature 0; abstain band below 0.85.</text>
  <line x1="90" y1="186" x2="1590" y2="186" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== Main band: agreement / confusion / precision-recall ===== -->

  <!-- Left: agreement numeral -->
  <text x="90" y="252" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">OVERALL AGREEMENT</text>
  <text x="86" y="428" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="168" fill="#1A1A1A">87.7%</text>
  <text x="90" y="478" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">agreement with the frozen answer key,</text>
  <text x="90" y="508" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">157 of 179 packets</text>

  <line x1="578" y1="232" x2="578" y2="540" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Middle: confusion table, gold rows against model columns -->
  <text x="622" y="252" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">GOLD (ROWS) AGAINST MODEL (COLUMNS)</text>

  <text x="742" y="302" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" fill="#777777">gold \ model</text>
  <text x="838" y="302" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#9E2A2B">SIGNAL</text>
  <text x="982" y="302" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="bold" fill="#1A1A1A">NO SIGNAL</text>
  <line x1="622" y1="320" x2="1062" y2="320" stroke="#999999" stroke-width="1"/>

  <text x="742" y="376" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">SIGNAL</text>
  <text x="838" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="36" fill="#1A1A1A">12</text>
  <text x="982" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="36" fill="#9E2A2B">8</text>
  <line x1="622" y1="398" x2="1062" y2="398" stroke="#DDDDDD" stroke-width="0.5"/>

  <text x="742" y="432" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">NO SIGNAL</text>
  <text x="838" y="436" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="36" fill="#9E2A2B">12</text>
  <text x="982" y="436" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="36" fill="#1A1A1A">145</text>
  <line x1="622" y1="454" x2="1062" y2="454" stroke="#DDDDDD" stroke-width="0.5"/>

  <text x="742" y="488" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">ABSTAIN</text>
  <text x="838" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="36" fill="#1A1A1A">0</text>
  <text x="982" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="36" fill="#1A1A1A">2<tspan font-size="20" dy="-14">&#8224;</tspan></text>
  <line x1="622" y1="510" x2="1062" y2="510" stroke="#999999" stroke-width="1"/>

  <text x="622" y="538" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13.5" fill="#777777">&#8224; Both gold-ABSTAIN filings were returned as NO SIGNAL.</text>

  <line x1="1102" y1="232" x2="1102" y2="540" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Right: precision and recall bars, directly labeled -->
  <text x="1142" y="252" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">PRECISION AND RECALL</text>

  <text x="1142" y="330" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">SIGNAL precision <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="22">0.50</tspan> <tspan fill="#777777">(12 of 24 calls)</tspan></text>
  <rect x="1142" y="348" width="224" height="11" fill="#1A1A1A"/>
  <line x1="1142" y1="359" x2="1590" y2="359" stroke="#BBBBBB" stroke-width="0.5"/>

  <text x="1142" y="428" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">SIGNAL recall <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="22">0.60</tspan> <tspan fill="#777777">(12 of 20 gold)</tspan></text>
  <rect x="1142" y="446" width="269" height="11" fill="#1A1A1A"/>
  <line x1="1142" y1="457" x2="1590" y2="457" stroke="#BBBBBB" stroke-width="0.5"/>

  <line x1="90" y1="576" x2="1590" y2="576" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== Abstention / null probe band ===== -->
  <text x="90" y="624" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">ABSTENTION</text>
  <text x="90" y="662" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">Abstentions: 0. The lowest verdict probability in the run was 0.88, above the 0.85 band;</text>
  <text x="90" y="692" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">all 22 disagreements were confident. False-confident rate <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="21">12.3%</tspan>.</text>

  <line x1="1062" y1="606" x2="1062" y2="716" stroke="#CCCCCC" stroke-width="0.5"/>

  <text x="1102" y="624" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">NULL PROBE</text>
  <text x="1102" y="662" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">An empty, filing-shaped document returned</text>
  <text x="1102" y="692" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">NO SIGNAL at probability 1.00, basis &#8216;empty packet&#8217;.</text>
  <text x="1102" y="722" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">Nothing invented.</text>

  <line x1="90" y1="752" x2="1590" y2="752" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== Case notes ===== -->
  <text x="90" y="796" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A"><tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="20">Cloudflare Form 144:</tspan> gold SIGNAL, model <tspan fill="#9E2A2B">NO SIGNAL</tspan> at 0.95, a confident miss on clustered insider sales.</text>
  <text x="90" y="834" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A"><tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="20">Kratos Defense Form 144:</tspan> gold NO SIGNAL, model NO SIGNAL at 0.95, a clean match on a routine plan notice.</text>

  <line x1="90" y1="866" x2="1590" y2="866" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== Run facts ===== -->
  <text x="90" y="900" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#333333">180 calls, zero failed. 1,171,914 tokens. Mean latency 5.58 s. Total cost $2.16 at Meta Model API list prices,</text>
  <text x="90" y="926" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#333333">about $0.012 per graded filing. Largest packet 183,823 prompt tokens.</text>

  <line x1="90" y1="950" x2="1590" y2="950" stroke="#999999" stroke-width="1"/>

  <!-- ===== Receipts ===== -->
  <text x="90" y="982" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Freeze commit</tspan>&#8195;834454df (aitrailblazer/coordination)</text>
  <text x="90" y="1006" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Answer key</tspan>&#8195;Corpus v4, sha256 8126b36c40f13b...</text>
  <text x="870" y="982" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Packet rollup</tspan>&#8195;sha256 f3e8fbaa6f190d3f...</text>
  <text x="870" y="1006" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Null document</tspan>&#8195;sha256 655ade23e918a3f4...</text>

  <!-- ===== Footer ===== -->
  <text x="90" y="1036" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="14" font-style="italic" fill="#777777">DeltaSignal &#183; &#169; 2026 AITrailblazer</text>
  <text x="1590" y="1036" text-anchor="end" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="14" font-style="italic" fill="#777777">An engine&#8217;s agreement is a published score, never validation of the Decider record.</text>
