<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1680" width="1680" height="1680" role="img" aria-label="Grading the Graders: Muse Spark 1.3 and Muse Spark Open on 179 frozen SEC filings">
  <rect x="0" y="0" width="1680" height="1680" fill="#FBFBF8"/>

  <!-- ===== Header ===== -->
  <text x="90" y="62" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="3" fill="#777777">ATLAS-7 FILING SENTINEL &#183; OPEN MODEL GRADING</text>
  <text x="88" y="126" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="56" fill="#1A1A1A">Grading the Graders</text>
  <line x1="90" y1="152" x2="1590" y2="152" stroke="#999999" stroke-width="1"/>
  <text x="90" y="186" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#444444">Two Meta models took the same exam: 179 real SEC filings, frozen before either model saw them, scored against a locked answer key.</text>
  <text x="90" y="214" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#444444">Corpus scope: 38 complete submissions, 141 primary-plus-EX-99. Temperature 0. Any verdict below 0.85 confidence had to be sat out.</text>
  <line x1="90" y1="240" x2="1590" y2="240" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== The mirror: model against model ===== -->
  <text x="90" y="282" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">THE MIRROR: THE TWO MODELS AGAINST EACH OTHER</text>
  <text x="86" y="408" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="128" fill="#1A1A1A">96.6%</text>
  <text x="90" y="446" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">the same verdict on 173 of 179 filings</text>

  <text x="720" y="316" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">They found the same 12 real signals, and missed the same 8.</text>
  <text x="720" y="348" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">They were wrong together on 21 filings.</text>
  <text x="720" y="380" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">They parted on only 6 filings, and all 6 were false alarms</text>
  <text x="720" y="412" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" fill="#1A1A1A">on routine paper: 5 raised by the open model, 1 by the served.</text>

  <rect x="90" y="470" width="1500" height="12" fill="#E7E4DC"/>
  <rect x="90" y="470" width="1450" height="12" fill="#1A1A1A"/>
  <rect x="1540" y="470" width="50" height="12" fill="#9E2A2B"/>
  <text x="90" y="506" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13.5" fill="#777777">SAME VERDICT &#183; 173</text>
  <text x="1590" y="506" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9E2A2B">DIFFER &#183; 6</text>
  <line x1="90" y1="536" x2="1590" y2="536" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== Two arms, small multiples ===== -->
  <line x1="840" y1="566" x2="840" y2="1298" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Left arm: Muse Spark 1.3 -->
  <text x="90" y="584" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="27" fill="#1A1A1A">Muse Spark 1.3</text>
  <text x="90" y="612" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" letter-spacing="1.5" fill="#777777">SERVED MODEL &#183; META MODEL API</text>

  <text x="90" y="664" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" letter-spacing="2.5" fill="#777777">AGREEMENT WITH THE KEY</text>
  <text x="86" y="756" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="92" fill="#1A1A1A">87.7%</text>
  <text x="90" y="788" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">157 of 179 filings</text>

  <text x="258" y="838" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" fill="#777777">gold \ model</text>
  <text x="390" y="838" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#9E2A2B">SIGNAL</text>
  <text x="582" y="838" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">NO SIGNAL</text>
  <line x1="90" y1="852" x2="710" y2="852" stroke="#999999" stroke-width="1"/>

  <text x="258" y="896" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">SIGNAL</text>
  <text x="390" y="900" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">12</text>
  <text x="582" y="900" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#9E2A2B">8</text>
  <line x1="90" y1="910" x2="710" y2="910" stroke="#DDDDDD" stroke-width="0.5"/>

  <text x="258" y="952" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">NO SIGNAL</text>
  <text x="390" y="956" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#9E2A2B">12</text>
  <text x="582" y="956" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">145</text>
  <line x1="90" y1="966" x2="710" y2="966" stroke="#DDDDDD" stroke-width="0.5"/>

  <text x="258" y="1008" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">ABSTAIN</text>
  <text x="390" y="1012" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">0</text>
  <text x="582" y="1012" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">2<tspan font-size="18" dy="-12">&#8224;</tspan></text>
  <line x1="90" y1="1022" x2="710" y2="1022" stroke="#999999" stroke-width="1"/>
  <text x="90" y="1050" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#777777">&#8224; Both gold-ABSTAIN filings were returned as NO SIGNAL, at 0.92 and 0.95.</text>

  <text x="90" y="1102" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" letter-spacing="2.5" fill="#777777">PRECISION AND RECALL, SIGNAL CLASS</text>
  <text x="90" y="1140" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">SIGNAL precision <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="20">0.50</tspan> <tspan fill="#777777">(12 of 24 calls)</tspan></text>
  <rect x="90" y="1154" width="280" height="10" fill="#1A1A1A"/>
  <line x1="90" y1="1164" x2="650" y2="1164" stroke="#BBBBBB" stroke-width="0.5"/>
  <text x="90" y="1206" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">SIGNAL recall <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="20">0.60</tspan> <tspan fill="#777777">(12 of 20 gold)</tspan></text>
  <rect x="90" y="1220" width="336" height="10" fill="#1A1A1A"/>
  <line x1="90" y1="1230" x2="650" y2="1230" stroke="#BBBBBB" stroke-width="0.5"/>

  <text x="90" y="1272" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" fill="#333333">180 calls, none failed &#183; 1,171,914 tokens</text>
  <text x="90" y="1298" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" fill="#333333">Mean latency 5.58 s &#183; $2.16 the run, about $0.012 per filing</text>

  <!-- Right arm: Muse Spark Open -->
  <text x="885" y="584" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="27" fill="#1A1A1A">Muse Spark Open</text>
  <text x="885" y="612" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" letter-spacing="1.5" fill="#777777">OPEN WEIGHTS &#183; BASETEN</text>

  <text x="885" y="664" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" letter-spacing="2.5" fill="#777777">AGREEMENT WITH THE KEY</text>
  <text x="881" y="756" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="92" fill="#1A1A1A">85.5%</text>
  <text x="885" y="788" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">153 of 179 filings</text>

  <text x="1053" y="838" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" fill="#777777">gold \ model</text>
  <text x="1185" y="838" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#9E2A2B">SIGNAL</text>
  <text x="1377" y="838" text-anchor="middle" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">NO SIGNAL</text>
  <line x1="885" y1="852" x2="1505" y2="852" stroke="#999999" stroke-width="1"/>

  <text x="1053" y="896" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">SIGNAL</text>
  <text x="1185" y="900" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">12</text>
  <text x="1377" y="900" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#9E2A2B">8</text>
  <line x1="885" y1="910" x2="1505" y2="910" stroke="#DDDDDD" stroke-width="0.5"/>

  <text x="1053" y="952" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">NO SIGNAL</text>
  <text x="1185" y="956" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#9E2A2B">16</text>
  <text x="1377" y="956" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">141</text>
  <line x1="885" y1="966" x2="1505" y2="966" stroke="#DDDDDD" stroke-width="0.5"/>

  <text x="1053" y="1008" text-anchor="end" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">ABSTAIN</text>
  <text x="1185" y="1012" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">0</text>
  <text x="1377" y="1012" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="30" fill="#1A1A1A">2<tspan font-size="18" dy="-12">&#8224;</tspan></text>
  <line x1="885" y1="1022" x2="1505" y2="1022" stroke="#999999" stroke-width="1"/>
  <text x="885" y="1050" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#777777">&#8224; Both gold-ABSTAIN filings were returned as NO SIGNAL, at 0.90 and 0.92.</text>

  <text x="885" y="1102" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" letter-spacing="2.5" fill="#777777">PRECISION AND RECALL, SIGNAL CLASS</text>
  <text x="885" y="1140" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">SIGNAL precision <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="20">0.43</tspan> <tspan fill="#777777">(12 of 28 calls)</tspan></text>
  <rect x="885" y="1154" width="241" height="10" fill="#1A1A1A"/>
  <line x1="885" y1="1164" x2="1445" y2="1164" stroke="#BBBBBB" stroke-width="0.5"/>
  <text x="885" y="1206" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18" fill="#1A1A1A">SIGNAL recall <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="20">0.60</tspan> <tspan fill="#777777">(12 of 20 gold)</tspan></text>
  <rect x="885" y="1220" width="336" height="10" fill="#1A1A1A"/>
  <line x1="885" y1="1230" x2="1445" y2="1230" stroke="#BBBBBB" stroke-width="0.5"/>

  <text x="885" y="1272" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" fill="#333333">180 calls, none failed &#183; 1,231,707 tokens</text>
  <text x="885" y="1298" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" fill="#333333">Mean latency 6.83 s &#183; $2.34 the run, about $0.013 per filing</text>

  <line x1="90" y1="1330" x2="1590" y2="1330" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- ===== Shared findings ===== -->
  <text x="90" y="1372" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">ABSTENTION, BOTH RUNS</text>
  <text x="90" y="1404" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">Abstentions: 0 on either run. The lowest verdict</text>
  <text x="90" y="1430" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">probability anywhere was 0.88, above the 0.85 band,</text>
  <text x="90" y="1456" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">so every disagreement was confident. False-confident</text>
  <text x="90" y="1482" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">rate: <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="19">12.3%</tspan> served, <tspan font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="19">14.5%</tspan> open.</text>

  <text x="885" y="1372" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="2.5" fill="#777777">NULL PROBE, BOTH RUNS</text>
  <text x="885" y="1404" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">An empty, filing-shaped document, graded by both.</text>
  <text x="885" y="1430" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">Both returned NO SIGNAL at probability 1.00,</text>
  <text x="885" y="1456" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">basis &#8216;empty packet&#8217;. Nothing invented.</text>

  <text x="90" y="1524" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" fill="#1A1A1A">One case, both models: Cloudflare&#8217;s Form 144, gold SIGNAL, clustered insider sales. Reading the document alone, both called it routine paper.</text>

  <line x1="90" y1="1556" x2="1590" y2="1556" stroke="#999999" stroke-width="1"/>

  <!-- ===== Receipts ===== -->
  <text x="90" y="1586" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Freeze commit</tspan>&#8195;834454df (aitrailblazer/coordination)</text>
  <text x="90" y="1610" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Answer key</tspan>&#8195;Corpus v4, sha256 8126b36c40f13b...</text>
  <text x="870" y="1586" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Packet rollup</tspan>&#8195;sha256 f3e8fbaa6f190d3f...</text>
  <text x="870" y="1610" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1A1A1A"><tspan fill="#777777">Null document</tspan>&#8195;sha256 655ade23e918a3f4...</text>

  <!-- ===== Footer ===== -->
  <text x="90" y="1648" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="14" font-style="italic" fill="#777777">DeltaSignal &#183; &#169; 2026 AITrailblazer</text>
  <text x="1590" y="1648" text-anchor="end" font-family="Georgia, 'Times New Roman', 'Liberation Serif', 'DejaVu Serif', serif" font-size="14" font-style="italic" fill="#777777">An engine&#8217;s agreement is a published score, never validation of the Decider record.</text>
</svg>
